<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Agent Live</title>
		<link rel="stylesheet" href="/v2/style.css" />
	</head>
	<body>
		<div id="app">
			<header id="bar">
				<span class="brand">AGENT LIVE</span>
				<span id="conn" class="pill offline">连接中…</span>
				<span id="model" class="pill">model: —</span>
				<span id="turns" class="pill">turn 0</span>
				<span id="usage" class="pill">0 tok · $0.0000</span>
				<span class="grow"></span>
				<select id="preset" class="btn" title="办公室预设" aria-label="办公室预设"></select>
				<button id="mute" class="btn" title="音效开关">音效: 关</button>
				<button id="demo" class="btn">演示</button>
			</header>

			<main>
				<div id="stageWrap">
					<canvas id="stage"></canvas>
					<div id="taskbar"><span class="k">当前需求</span><span id="task">等待指令…</span></div>
				</div>

				<aside id="side">
					<section class="panel">
						<h2>员工</h2>
						<div id="crew" class="crew"></div>
					</section>
					<section class="panel grow">
						<h2>动态</h2>
						<div id="log" class="log"></div>
					</section>
				</aside>
			</main>

			<form id="clientControls" class="client-controls" hidden>
				<div id="approval" class="approval" hidden>
					<div><strong id="approvalTitle"></strong><span id="approvalDetail"></span></div>
					<button type="button" class="btn" data-approval="deny">拒绝</button>
					<button type="button" class="btn" data-approval="allow">允许</button>
				</div>
				<select id="clientModel" class="btn model-select" aria-label="Codex 模型" title="本轮使用的 Codex 模型">
					<option value="">加载模型…</option>
				</select>
				<textarea id="promptInput" rows="2" placeholder="给 Codex 一个任务…"></textarea>
				<button id="stopTurn" type="button" class="btn">停止</button>
				<button id="sendPrompt" type="submit" class="btn primary">发送</button>
			</form>
		</div>

		<script type="module" src="/v2/bootstrap.js"></script>
	</body>
</html>
