name: Feature request
description: Propose a focused product, content or Adapter improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the desired behavior without assuming an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Engine, Viewer, Content, Creator, Adapter SDK, Pi, Codex, DeepSeek Harness, Documentation]
    validations:
      required: true
