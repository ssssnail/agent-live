name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate release source and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:ci
      - name: Pack release artifacts
        run: |
          npm pack --ignore-scripts
          npm pack ./packages/pi --ignore-scripts
          npm pack ./plugins/agent-live/dsh --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --title "Agent Live $GITHUB_REF_NAME"
